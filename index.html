<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code & Sip Makeup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Montserrat:wght@500;600;700&display=swap">
<style>
:root{--bg1:#f9806a;--bg2:#fcc3a8;--bg3:#fdf3e1;--ink:#1a1210;--gold:#c9a24b;--gold2:#f3dc9a;--coral:#f0705f;--coral2:#f79a86;--card:rgba(255,255,255,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#7a2e2a;--bg2:#4a2224;--bg3:#241214;--ink:#fbeee6;--card:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg1:#7a2e2a;--bg2:#4a2224;--bg3:#241214;--ink:#fbeee6;--card:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%);background-attachment:fixed;display:flex;justify-content:center;overflow-x:hidden}
.glow{position:fixed;top:-120px;right:-120px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),transparent 65%);pointer-events:none}
main{position:relative;width:100%;max-width:460px;padding:36px 22px 40px;text-align:center}
.logo{width:150px;height:150px;border-radius:50%;margin:0 auto 22px;padding:5px;background:linear-gradient(135deg,var(--gold2),var(--gold),var(--gold2));box-shadow:0 10px 30px rgba(120,40,30,.3);animation:float 5s ease-in-out infinite}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(34px,10vw,46px);line-height:1.08;margin:0 0 10px;letter-spacing:.5px}
.tag{font-size:18px;font-weight:500;margin:0 0 6px}
.tag span{color:var(--gold)}
.divider{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px auto 18px;color:var(--gold)}
.divider i{height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.msg{font-family:'Playfair Display',Georgia,serif;font-size:18px;line-height:1.45;font-weight:500;margin:0 auto 26px;padding:16px 18px;border-radius:20px;background:var(--card);border:1px solid rgba(201,162,75,.45);backdrop-filter:blur(6px)}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:17px 20px;margin:0 0 14px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px;letter-spacing:.8px;text-transform:uppercase;transition:transform .18s,box-shadow .18s}
.btn:hover,.btn:focus-visible{transform:translateY(-3px)}
.btn svg{width:22px;height:22px;flex:none}
.cat{background:linear-gradient(180deg,#2b2320,#000);color:#fff;font-size:17px;border:1.5px solid var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.soc{background:linear-gradient(180deg,var(--coral2),var(--coral));color:#fff;border:1.5px solid rgba(255,255,255,.55);box-shadow:0 8px 18px rgba(200,70,50,.35)}
.icons{display:flex;justify-content:center;gap:22px;margin-top:26px}
.icons a{color:var(--ink);display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--gold);transition:transform .18s}
.icons a:hover{transform:scale(1.1) rotate(-6deg)}
.icons svg{width:24px;height:24px}
footer{margin-top:22px;font-size:12px;letter-spacing:2px;opacity:.75}
.sp{position:absolute;color:var(--gold);font-size:22px;animation:tw 3s ease-in-out infinite;pointer-events:none}
.s1{top:40px;left:14px}.s2{top:90px;right:16px;animation-delay:1s;font-size:16px}.s3{top:230px;left:30px;animation-delay:1.8s;font-size:14px}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes tw{50%{opacity:.25;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
